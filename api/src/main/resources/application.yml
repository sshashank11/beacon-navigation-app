server:
  port: ${PORT:8080}
  
logging:
  pattern:
    # The request id makes a line joinable to the request that produced it,
    # including work that finishes in the Python worker.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [beacon-api] [%X{requestId:-no-request}] %-40.40logger{39} : %m%n"

spring:
  application:
    name: beacon-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/beacon}
    username: ${POSTGRES_USER:beacon}
    password: ${POSTGRES_PASSWORD:beacon}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

beacon:
  routing:
    enabled: ${BEACON_ROUTING_ENABLED:true}
    osm-path: ${BEACON_OSM_PATH:../data/osm/nyc.osm.pbf}
    graph-path: ${BEACON_GRAPH_PATH:../graph-cache}

  cors:
    # Comma-separated origins allowed to call the API from a browser. Leave
    # empty when the web app is served from the same origin as the API.
    allowed-origins: ${BEACON_CORS_ALLOWED_ORIGINS:}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:beacon}
    secret-key: ${MINIO_SECRET_KEY:beacon-password}
  tts:
    provider: ${BEACON_TTS_PROVIDER:auto}
    fish-api-key: ${FISH_AUDIO_KEY:}
    fish-reference-id: ${FISH_AUDIO_REFERENCE_ID:}
    fish-model: ${FISH_AUDIO_MODEL:speech-1.6}
    piper-binary: ${PIPER_BINARY:}
    piper-voice: ${PIPER_VOICE:}
    speed: ${BEACON_TTS_SPEED:1.0}
    bucket: ${MINIO_BUCKET:beacon}
