spring:
  application:
    name: beacon-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/beacon}
    username: ${POSTGRES_USER:beacon}
    password: ${POSTGRES_PASSWORD:beacon}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
