spring:
  application:
    name: beacon-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/beacon}
    username: ${POSTGRES_USER:beacon}
    password: ${POSTGRES_PASSWORD:beacon}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

beacon:
  routing:
    enabled: ${BEACON_ROUTING_ENABLED:true}
    osm-path: ${BEACON_OSM_PATH:../data/osm/nyc.osm.pbf}
    graph-path: ${BEACON_GRAPH_PATH:../graph-cache}
