[project]
name = "beacon-pipeline"
version = "0.1.0"
description = "Environmental data ingestion and geospatial processing for Beacon"
readme = "README.md"
authors = [
    { name = "Shashank Sharma" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "mercantile>=1.2.1",
    "numpy>=2.3.0",
    "pandas>=3.0.5",
    "Pillow>=11.3.0",
    "prefect>=3.8.3",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.1.0",
    "rasterio>=1.5.1",
    "redis>=6.4.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
vision = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.57.0,<6.0.0",
]

[project.scripts]
beacon-pipeline = "beacon_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
